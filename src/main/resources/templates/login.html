<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<h1>Login</h1>

<p th:if="${param.error}">Invalid email or password.</p>
<p th:if="${param.logout}">You have been logged out.</p>
<p th:if="${param.registered}">Registration successful, please log in.</p>

<form th:action="@{/login}" method="post">
    <div>
        <label for="username">Email</label>
        <input type="email" id="username" name="username" required>
    </div>
    <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
    </div>
    <button type="submit">Login</button>
</form>

<p>No account yet? <a th:href="@{/register}">Register</a></p>
</body>
</html>
